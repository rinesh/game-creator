name: Validate KAPLAY skill

on:
  push:
    paths:
      - ".github/workflows/validate-kaplay-skill.yml"
      - "README.md"
      - "package.json"
      - "scripts/validate-kaplay-skill.mjs"
      - "skills/kaplay/**"
      - "tests/fixtures/kaplay-skill-contract.json"
      - "tests/flows/08-kaplayground-webmcp.md"
      - "tests/trigger-*.txt"
      - "tests/trigger-tests.md"
  pull_request:
    paths:
      - ".github/workflows/validate-kaplay-skill.yml"
      - "README.md"
      - "package.json"
      - "scripts/validate-kaplay-skill.mjs"
      - "skills/kaplay/**"
      - "tests/fixtures/kaplay-skill-contract.json"
      - "tests/flows/08-kaplayground-webmcp.md"
      - "tests/trigger-*.txt"
      - "tests/trigger-tests.md"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
